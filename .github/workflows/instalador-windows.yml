# Gera o instalador NLR-Setup-x.y.z.exe no Windows (Inno Setup) a cada tag v* ou manualmente.
name: instalador-windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes (Windows)
        continue-on-error: true  # falha nos testes aparece no log, mas não impede o .exe
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          uv venv .venv --python 3.12
          uv pip install --python .venv\Scripts\python.exe -e ".[completo,dev]"
          .venv\Scripts\python.exe -m pytest -q -m "not modelo_real and not rede"
      - name: Baixar uv.exe para dentro do instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force instalador\uv | Out-Null
          Invoke-WebRequest https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip -OutFile uv.zip
          Expand-Archive uv.zip -DestinationPath instalador\uv -Force
          Get-ChildItem instalador\uv -Recurse -Filter uv.exe | Select-Object -First 1 | Copy-Item -Destination instalador\uv\uv.exe -Force
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compilar o instalador
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" instalador\NLR.iss'
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: NLR-Setup
          path: instalador/saida/*.exe
      - name: Descobrir a versão
        id: versao
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
      - name: Publicar na release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.versao.outputs.tag }}
          files: instalador/saida/*.exe
